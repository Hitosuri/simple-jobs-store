[project]
name = "simple-jobs-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", "ISC001",          # conflict with ruff format
    "PLR0913", "PLR0917",         # store/route functions take several keyword-only params
    "TC001", "TC002", "TC003",   # FastAPI/Pydantic evaluate annotations at runtime
    "CPY001",                    # repo has no copyright header convention
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN401"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # starlette 1.6.0's testclient.py references the deprecated anyio.abc.BlockingPortal
    # alias at module level; nothing in our code triggers or can fix this.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
